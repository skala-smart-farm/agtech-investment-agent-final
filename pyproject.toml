[project]
name = "agtech-investment-agent"
version = "0.1.0"
description = "LangGraph Multi-Agent + Agentic RAG for AgTech startup investment evaluation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langgraph>=1.0.1",
    "langchain>=1.0.2",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.1",
    "langchain-community>=0.3.31",
    "langchain-classic>=1.0.0",
    "langchain-tavily>=0.2.12",
    "langchain-huggingface>=1.0.0",
    "sentence-transformers>=5.1.0",
    "torch>=2.6.0",
    "faiss-cpu>=1.12.0",
    "kiwipiepy>=0.21.0",
    "rank-bm25>=0.2.2",
    "pymupdf>=1.26.0",
    "pdfplumber>=0.11.8",
    "pypdf>=6.0.0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.6",
    "markdown>=3.9",
    "playwright>=1.55.0",
    "finance-datareader>=0.9.202",
    "langsmith>=0.4.0",
    "pandas>=2.3.3",
    "pydantic>=2.11.0",
    "tabulate>=0.10.0",
    "trafilatura>=2.2.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["api: API 키가 필요한 테스트 (기본 실행에서 제외, 필요할 때 -m api 로 실행)"]
addopts = '-m "not api"'
