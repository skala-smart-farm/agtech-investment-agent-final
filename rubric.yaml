# 투자 판단 평가표 (6개 기준 × 4문항 = 24문항, 동종 평균 대비 배수로 계산 — 아래 decision_rule)
#
# 근거
# - 항목·가중치: 과제의 Scorecard 표 (창업자 30 / 시장성 25 / 제품·기술력 15 / 경쟁 우위 10 / 실적 10 / 투자조건 10)
#   원 출처인 Bill Payne Scorecard(ACA, Rev 2019)와 앞 3개 가중치가 같다. 뒤 3개는 과제 기준을 따른다.
# - 세부 질문: 과제의 Bessemer 체크리스트 10문항을 모두 배치하고(bessemer 필드),
#   AgTech 투자에서 반복되는 실패 요인(농가 ROI, 다작기 실증, 인허가, 자본집약도, 보조금 의존)을 반영했다.
#
# short: 보고서·README 에서 쓰는 문항 짧은 이름
# owner: 이 기준(차원)을 판정하는 에이전트 (founder·market·tech·competition, 실적·투자조건은 decision)
# point: 과제 Scorecard 표의 '평가 포인트' 중 이 문항이 재는 것 (대리지표면 괄호에 '대리지표' 표기)
# bessemer_q: 이 문항이 관련된 Bessemer 체크리스트 질문 번호 (아래 bessemer 목록의 q)
# dd_item: 공개 정보로 확인되지 않을 때 투자 전에 회사에 직접 확인할 실사 항목
#
# 판정 값
# - YES     : 질문을 직접 뒷받침하는 근거 id + 근거 원문 인용(quote). 인용이 근거 본문에 없으면 코드가 UNKNOWN 으로 강등
# - NO      : 질문과 반대되는 근거가 있음 (예: "시제품 단계" 명시). 반대 문장 인용이 본문에 없거나, 판정 이유가
#             "추정·불분명·확인되지 않음·근거가 없음" 같은 근거 부족이면 코드가 UNKNOWN 으로 바꾼다
# - UNKNOWN : 근거를 찾지 못함 → 신호 0. 분모를 줄이지 않는다 (정보를 감춘 회사가 유리해지지 않게)
# - N/A     : na_allowed 문항만. 사유 필수, 분모에서 제외
# third_party: 회사 자체 발표만으로는 YES 불가 (과장이 흔한 성능·경제성 수치). 회사 도메인 근거뿐 아니라,
#              기사라도 인용 앞뒤 120자(공백 제외)에 대표·회사 측 발언('대표는', '라고 말했다', '회사 측')이나
#              목표·계획·예정 표현이 있으면 회사 주장으로 보고 UNKNOWN
# market_level: 시장 수준 문항. 그 밖의 문항은 회사 고유 사실이라 근거 본문에 회사명이 있어야 YES
# recent     : 평가일 기준 24개월 이내 근거만 인정. 웹은 게시일 기준(기업 DB 프로필 페이지는 현재 정보로 간주),
#              문서는 data/manifest.yaml 발행 연도 ≥ 평가 연도 - 2 (쪽마다 날짜가 없어 연도 단위로 본다).
#              인용·이유에 적힌 사건 날짜가 모두 24개월보다 오래돼도 불인정.
#              24개월 = [평가일 − 24개월, 평가일]: 평가일보다 뒤 날짜(예정·계획)는 최근이 아니다. 인용 속 날짜가
#              평가일 이후뿐이거나, 인용이 완료 표지 없는 예정·계획·목표 문장이면 불인정 (core/recency.py)
# commercial : 상용 운영 문항. 인용 앞뒤 120자(공백 제외)에 예정·목표·실증·PoC·시범 표현이 있거나,
#              인용에 수량(숫자·'세 곳' 등)이나 고객 이름(농협·영농조합·농업회사법인)이 없으면 UNKNOWN

dimensions:
  - id: founder
    name: 창업자·팀 (Owner)
    weight: 30
    owner: founder        # 이 기준을 판정하는 에이전트
    questions:
      - {id: F1, short: 창업팀 이력, point: "전문성", bessemer_q: [5, 10], dd_item: "창업자·경영진 이력과 창업 전 경력 증빙", bessemer: "창업자와 팀은 이 분야에서 믿을 만한가 / 창업자가 다음 10년을 이 분야에 쏟을 각오가 있는가(대리지표)", text: "창업자나 경영진이 창업 이전부터 농업 현장이나 해당 기술 분야에서 연구·실무·사업 경험을 쌓았는가? (농학·축산·수의·원예 전공, 관련 연구·실무, 이전 창업 등)", need: "이름과 경력이 함께 적힌 근거"}
      - {id: F2, short: 기술 책임자 이력, point: "전문성(기술 역량)", bessemer_q: [5], dd_item: "기술 책임자 이력·특허 발명자·논문 목록", bessemer: "창업자와 팀은 이 분야에서 믿을 만한가", text: "핵심 기술(AI·로봇·센서) 책임자의 기술 이력(특허 발명자, 논문, 연구소·기업 경력)이 확인되는가?", need: "기술 책임자 개인의 특허·논문·연구·경력이 적힌 근거 (회사 기술 소개나 출신 학교만으로는 부족)"}
      - {id: F3, short: 최근 마일스톤, point: "실행력", bessemer_q: [10], dd_item: "최근 24개월 마일스톤 증빙", bessemer: "(실행력)", text: "최근 24개월 안에 공개된 마일스톤(제품 출시, 현장 설치, 인증, 정부 과제·TIPS 선정, 후속 투자)이 2건 이상 있는가?", need: "날짜가 있는 마일스톤 근거 2개 이상 (투자 유치·수상·정부 선정·혁신상·우수기업 선정·출시·인증)", recent: true}
      - {id: F4, short: 제3자 교차 확인, point: "커뮤니케이션(대리지표: 대외 발표 수치의 제3자 확인)", bessemer_q: [5], dd_item: "회사 공개 수치의 원자료", bessemer: "(커뮤니케이션·신뢰)", text: "회사가 공개한 핵심 수치(고객 수·성능·매출 등)가 제3자 근거로도 확인되는가? 서로 모순되는 근거가 있으면 NO", need: "같은 수치를 확인한 제3자 근거 (모순 근거가 있을 때만 NO)", third_party: true}
  - id: market
    name: 시장성 (Opportunity Size)
    weight: 25
    owner: market         # 이 기준을 판정하는 에이전트
    questions:
      - {id: M1, short: 시장 규모, point: "시장 크기", bessemer_q: [1], dd_item: "세부 시장 규모 추정의 기준 연도·출처", market_level: true, bessemer: "이 시장은 얼마나 큰가", text: "목표 시장(해당 세부 분야 또는 스마트농업·애그테크 시장)의 규모가 공공기관·국제기구·연구기관 문서에서 수치와 기준 연도로 확인되는가?", need: "문서 코퍼스 근거([D...]) 필수", doc_required: true}
      - {id: M2, short: 시장 성장, point: "성장 가능성", bessemer_q: [8], dd_item: "세부 분야 최근 2년 투자·도입 추이", market_level: true, bessemer: "이 스타트업이 성공한다면 정말 큰 기회가 될까", text: "해당 분야가 성장 중이라는 최근 근거(투자액·도입률·정책 예산 증가)가 있는가?", need: "발행 연도가 있는 수치 (평가일 기준 최근 2년 안에 발행된 근거)", recent: true}
      - {id: M3, short: 경제적 효과, point: "수요(실제 문제 해결)", bessemer_q: [2], dd_item: "농가 투자 회수기간(payback)·효과 실측", bessemer: "제품이 시장의 실제 문제를 해결하는가", text: "고객의 실제 문제와 제품의 경제적 효과(비용 절감, 수확량 증가, 노동 절감)가 수치로 제시되고 제3자 근거가 있는가?", need: "제3자 출처의 효과 수치", third_party: true}
      - {id: M4, short: 수익 모델, point: "수요(지불 이유·수익 모델)", bessemer_q: [3, 7], dd_item: "가격표·과금 구조·지불 주체", bessemer: "고객이 실제로 이 제품에 비용을 지불할 이유가 있는가 / 수익 모델은 명확한가", text: "누가 돈을 내는지와 과금 방식(장비 판매, 구독, 서비스, 수수료, 공공 조달)이 확인되는가?", need: "과금 방식을 서술한 근거"}
  - id: product
    name: 제품/기술력
    weight: 15
    owner: tech           # 이 기준을 판정하는 에이전트
    questions:
      - {id: P1, short: 상용 운영, point: "구현 가능성(상용 운영)", bessemer_q: [2], dd_item: "PoC·시범이 아닌 유료 설치·계약 목록", bessemer: "(구현 가능성)", text: "시제품 단계를 지나 실제 농장·온실·축사에서 상용으로 운영 중인가?", need: "설치 수·면적·두수·고객명 중 하나 이상 (상용화 예정·실증·PoC·시범 운영은 상용 운영이 아님)", commercial: true}
      - {id: P2, short: 제3자 실증, point: "구현 가능성(제3자 실증)", bessemer_q: [2], dd_item: "기관·대학 실증 결과서", bessemer: "(검증)", text: "성능이 여러 작기(연도) 또는 여러 지역의 현장 실증으로 제시되는가?", need: "공공기관·대학·지자체 등 제3자 실증 근거", third_party: true}
      - {id: P3, short: 자체 기술, point: "독창성", bessemer_q: [4], dd_item: "자체 개발 증빙", bessemer: "경쟁사보다 뚜렷한 차별성이 있는가", text: "핵심 기술이 자체 개발임을 보여 주는 근거(자사 특허·논문, 자체 데이터셋, 자체 하드웨어)가 있는가?", need: "자체 개발 근거"}
      - {id: P4, short: 인허가, point: "구현 가능성(인허가)", bessemer_q: [9], dd_item: "필수 검정·등록 현황", bessemer: "기술, 운영, 법률적 리스크는 무엇인가", text: "제품 유형상 필요한 인허가·검정(농업기계 검정, 농약·비료·동물용 의약품 등록 등)을 받았거나 신청했는가? 대상이 아니면 N/A", need: "회사 제품의 검정·등록·인증 사실 (정부의 기준 마련·정책 기사는 회사 인허가 근거가 아님) 또는 N/A 사유", na_allowed: true}
  - id: competition
    name: 경쟁 우위
    weight: 10
    owner: competition    # 이 기준을 판정하는 에이전트
    questions:
      - {id: C1, short: 특허, point: "특허", bessemer_q: [4], dd_item: "특허 등록·출원 번호", bessemer: "(진입장벽)", text: "핵심 기술 관련 특허(등록 또는 출원)가 1건 이상 확인되는가? (초기 기업이라 출원도 인정, 보고서에 등록·출원 구분 표기)", need: "특허 근거"}
      - {id: C2, short: 경쟁사 대비 차별점, point: "진입장벽(경쟁사 대비 차별점)", bessemer_q: [4], dd_item: "경쟁 제품 대비 성능·가격 비교", bessemer: "경쟁사 보다 뚜렷한 차별성이 있는가", text: "국내외 경쟁사 2곳 이상과 비교했을 때 구체적인 차별점(성능·가격·적용 작목·범위)이 근거로 확인되는가?", need: "경쟁사 비교 근거"}
      - {id: C3, short: 데이터 축적 구조, point: "네트워크 효과", bessemer_q: [], dd_item: "데이터 축적·연동 구조", bessemer: "(네트워크 효과)", text: "사용이 늘수록 자체 데이터가 쌓여 성능이 좋아지거나, 설치·연동 때문에 교체 비용이 드는 구조인가?", need: "데이터 축적·연동 구조 근거"}
      - {id: C4, short: 전략 파트너 계약, point: "진입장벽(전략 파트너)", bessemer_q: [], dd_item: "전략 파트너 계약서(MOU 제외)", bessemer: "(파트너)", text: "유통·전략 파트너(농협, 농기계·농자재 기업, 지자체, 대형 유통, 해외 파트너)와 계약이나 공동사업이 있는가? (MOU 만 있으면 NO)", need: "계약 상대방이 적힌 근거"}
  - id: traction
    name: 실적
    weight: 10
    owner: decision       # 이 기준을 판정하는 에이전트
    questions:
      - {id: R1, short: 매출, point: "매출", bessemer_q: [7], dd_item: "연도별 매출·매출총이익률", bessemer: "(매출)", text: "연도가 적힌 매출액이 기업 DB·공시·보도로 확인되는가?", need: "매출 금액과 연도 (투자 유치 금액은 매출이 아님)", recent: true}
      - {id: R2, short: 유료 고객·설치 규모, point: "유저수", bessemer_q: [3, 6], dd_item: "유료 고객 수·설치 규모", bessemer: "초기 고객의 반응은 어떠한가", text: "유료 고객이나 설치 규모(고객 수, 농가 수, 면적, 두수, 계약 금액)가 수치로 확인되는가?", need: "수치", recent: true}
      - {id: R3, short: 재계약, point: "계약(재계약·확대)", bessemer_q: [6], dd_item: "재계약률·이탈률(churn)", bessemer: "초기 고객의 반응은 어떠한가", text: "같은 고객의 재계약·확대 도입이나 여러 해 연속 사용 근거가 있는가?", need: "재사용 근거"}
      - {id: R4, short: 민간 매출, point: "매출(민간)", bessemer_q: [7], dd_item: "보조금 외 민간 매출 비중", bessemer: "(보조금 의존도)", text: "정부 보조사업이 아닌 매출(민간 판매, 수출, 기업 간 계약) 근거가 있는가?", need: "민간·수출 판매 근거"}
  - id: deal
    name: 투자조건 (Deal Terms)
    weight: 10
    owner: decision       # 이 기준을 판정하는 에이전트
    questions:
      - {id: D1, short: 최근 라운드, point: "Valuation(최근 라운드)", bessemer_q: [], dd_item: "최근 라운드 금액·일자", bessemer: "(자금 조달)", text: "최근 24개월 안의 투자 라운드 단계·금액·시점이 공개 근거로 확인되는가?", need: "단계·금액·시점이 적힌 근거", recent: true}
      - {id: D2, short: 기관투자자, point: "투자조건(기관투자자)", bessemer_q: [], dd_item: "투자자 명단·조건", bessemer: "(투자 조건의 적절성)", text: "최근 라운드에 기관투자자(VC, CVC, 정책 펀드, TIPS 운영사)가 참여했는가?", need: "투자사 이름"}
      - {id: D3, short: 기업가치, point: "Valuation·지분율", bessemer_q: [], dd_item: "밸류에이션·지분율·term sheet", bessemer: "(Valuation·지분율)", text: "기업가치(Valuation) 또는 투자 지분율이 공개 근거로 확인되는가?", need: "수치 근거 (비공개면 UNKNOWN, 보고서에 실사 필요로 표기)"}
      - {id: D4, short: 자본집약도, point: "투자조건(자본집약도)", bessemer_q: [9], dd_item: "상업화까지 필요 자금·설비 계획", bessemer: "기술, 운영, 법률적 리스크는 무엇인가", text: "상업화 전에 대규모 자체 시설(대형 수직농장 등)이 필요 없는 모델이거나, 필요하다면 전략적 투자자·비희석 자금을 확보했는가?", need: "사업 모델·자금 구조 근거"}

# Bessemer 체크리스트 10문 (text: 과제 가이드 원문 그대로, 오타 포함)
# via  : 이 질문의 답을 정할 때 쓰는 평가표 문항 (각 문항의 bessemer_q 에 이 번호가 있는 문항 중 직접 답하는 것)
# proxy: 공개 정보로 직접 답할 수 없어 대리지표로 답함 (Q10: 창업 전 같은 분야 경력 F1 + 창업 후 지속된 마일스톤 F3)
bessemer:
  - {q: 1, text: "이 시장은 얼마나 큰가?", via: [M1], proxy: false}
  - {q: 2, text: "제품이 시장의 실제 문제를 해결하는가?", via: [M3, P1], proxy: false}
  - {q: 3, text: "고객이 실제로 이 제품에 비용을 지불할 이유가 있는가?", via: [M4, R2], proxy: false}
  - {q: 4, text: "경쟁사 보다 뚜렷한 차별성이 있는가?", via: [C2, P3, C1], proxy: false}
  - {q: 5, text: "창업자와 팀은 이 분야에서 믿을만한가?", via: [F1, F2], proxy: false}
  - {q: 6, text: "초기 고객의 반응은 어떠한가?", via: [R2, R3], proxy: false}
  - {q: 7, text: "수익 모델은 명확한가?", via: [M4, R4], proxy: false}
  - {q: 8, text: "이 스사트업이 성공한다면, 정말 큰 기회가 될까?", via: [M2], proxy: false}
  - {q: 9, text: "기술, 운영, 법률적 리스크는 무엇인가?", via: [P4, D4], proxy: false}
  - {q: 10, text: "이 창업자가 다음 10년을 이 분야에 쏟아부을 각오가 있는가?", via: [F1, F3], proxy: true}

# 관문(Gate): 적격성 검증 에이전트가 평가 전에 차단 (통과 못 하면 평가하지 않음)
gates:
  - {id: G1, text: "비상장 — 한국거래소 상장 목록과 코드로 대조, 해외는 뉴스 근거"}
  - {id: G2, text: "최근 투자 단계 Seed~Series C (근거 id 필수, 확인 불가면 탈락)"}
  - {id: G3, text: "Exit(M&A·IPO) 완료 없음 — '추진'은 통과"}
  - {id: G4, text: "최근 24개월 중대한 부정 신호 없음 (회생·파산·폐업·사업 중단·창업자 이탈·분쟁·제재) — 반증 검색 1회"}
  - {id: G5, text: "AI·센서·로봇이 농업 생산성 향상의 핵심 (배달·유통만 하는 기업, 상장사·대기업 계열 제외)"}
  - {id: G6, text: "최소 근거량 — 서로 다른 출처 3곳 이상, 그중 1곳 이상은 회사 자체 발표가 아닌 제3자 출처"}

# 거래 중단 사유(Deal-killer): 점수와 관계없이 "보류" (Payne 워크시트의 deal killer 를 공개 정보 기준으로 옮김)
deal_killers:
  - {id: K1, when: {P4: "NO"}, text: "판매 중인데 필수 인허가·검정 미취득"}
  - {id: K2, when: {C1: "NO", C2: "NO"}, text: "특허도 없고 경쟁사 대비 차별점도 없음 (쉽게 복제 가능)"}
  - {id: K3, when: {F4: "NO"}, text: "회사 공개 수치가 제3자 근거와 모순 (신뢰 문제) — 모순 근거가 있을 때만 NO"}

decision_rule: >
  문항 신호 x = YES +1 · NO −1 · 미확인 0. 기준 d 의 배수 c_d = clip(1 + 0.5 × 평균(x_q − x̄_q), 0.5, 1.5),
  x̄_q 는 동종 기준 집단(app.py --calibrate, 자기 제외)의 문항 평균 신호(5곳 미만이면 0). M = Σ 가중치_d × c_d (동종 평균 = 1.00).
  투자 ⇔ M > 1.00 AND 창업자 기준 c_founder ≥ 1.00 AND Deal-killer 없음. 두 기준값 모두 Payne Scorecard 원 방법의 기준점
  '투자를 받은 동종 평균 기업 = 100%' 이며 새로 정한 숫자가 아니다(팀 조건: "A great team will fix early product flaws,
  but the reverse is not true" — Payne 2019). 그 외는 보류이며 보류 유형은 Deal-killer > 창업자 점수 평균 미만 > 동종 평균 이하
  순으로 하나를 붙인다. 기준을 바꿨을 때의 결과(1.00~1.20 민감도)를 보고서에 함께 싣는다.
  수치는 config.yaml decision 과 같아야 한다(tests/test_decision.py 가 확인).
