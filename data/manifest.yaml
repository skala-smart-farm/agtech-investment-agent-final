# 선정 원칙
#  1) 공공기관·국제기구·연구기관·학술지의 공개 문서만 (유료 시장조사 홍보 페이지 제외)
#  2) 2023년 이후 발행 (투자 판단의 최신성)
#  3) 최종본만 쓴다. 문서 전체가 원칙이되, 한도 안에서 필요한 문서를 더 넣으려고 원본 쪽 번호의 연속 한 구간(page_range)만
#     쓸 수 있다. 빼는 쪽은 표지·목차·빈 쪽·참고문헌·방법론·부록처럼 인용·평가 정답에 쓰인 적이 없는 쪽이고(검색 잡음이던
#     참고문헌·목차 포함), 긴 보고서는 에이전트 질문에 맞는 장·절만 쓴다. 문서마다 사유를 trim 에 적는다.
#     200쪽은 사용 구간 기준으로 센다(rag/loader.py total_pages). pages_total = 사용 쪽수, pages_pdf = 원본 PDF 쪽수(구간이 있는 문서만)
#     조각의 page 는 원본 PDF 쪽 번호 그대로라 인용 쪽 번호가 바뀌지 않는다
#  4) 에이전트 질문에 대응: 시장 규모·성장(market), 투자 동향(market·discovery), 정책·규제(market),
#     기술 동향 기준선(tech), 국내 스타트업 발굴 시드(discovery), 도입 장벽·리스크(market)
#  5) 평가 후보가 몰린 세부 분야에 기술·사업성 기준선 문서를 둔다: 로봇, 시설원예·수직농장, 축산, 그리고
#     작물 병해 진단(diagnosis)·농업 데이터 분석·예측(agdata). 뒤의 두 분야는 심층 평가 10곳 중 4곳이 속하는데 기준선 문서가
#     없어서 추가했다(frontiers_pd2024, worldbank_ai2025)
#  6) 이해상충 문서는 뺀다 (예: 평가 후보 기업 소속 연구소장이 쓴 보고서)
